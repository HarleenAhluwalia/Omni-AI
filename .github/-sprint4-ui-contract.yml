
name: SCRUM-383-384 - Frontend UI Source Contracts

on:
  push:
    branches: [main, harleen-sprint4-auth-testing]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Task Form and Authentication UI source contracts
        working-directory: client
        run: npm run test:sprint4-ui-contract
