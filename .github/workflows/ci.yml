name: CI
 
on:
  push:
    branches: [main, Jerry-Sprint-5-cicd]
  pull_request:
    branches: [main]
 
jobs:
  backend-tests:
    name: Backend unit/integration tests (Jerry — SCRUM-321 / SCRUM-324)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
 
      - name: Install dependencies (reproducible)
        run: npm ci
 
      - name: Run backend test suite
        run: npm test
 
      - name: Generate build ID
        id: build_id
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_ID="omni-ai-build-${{ github.run_number }}-${SHORT_SHA}"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Build ID: $BUILD_ID"
 
      - name: Report build status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ PASS — ${{ steps.build_id.outputs.build_id }}"
          else
            echo "❌ FAIL — ${{ steps.build_id.outputs.build_id }}"
          fi
 

  harleen-frontend-ci:
    name: Harleen - SCRUM-326 Build / SCRUM-327 To-Do Tests / SCRUM-328 Build ID

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: SCRUM-328 - Generate Build ID
        id: harleen_build_id
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_ID="omni-ai-build-${{ github.run_number }}-${SHORT_SHA}"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Build ID: $BUILD_ID"

      - name: SCRUM-326 - React/Vite Frontend Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_URL: http://localhost:4000/api
        run: npm run build

      - name: SCRUM-327 - Prioritized To-Do Tests
        run: npm run test:prioritized

      - name: Report Harleen CI status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "PASS — ${{ steps.harleen_build_id.outputs.build_id }}"
          else
            echo "FAIL — ${{ steps.harleen_build_id.outputs.build_id }}"
          fi

  medrian-ai-api-tests:
    name: Medrian - AI/API Automated Tests (SCRUM-347)

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run AI/API and UC-1 workflow tests
        run: npx jest tests/ai.test.js tests/uc1Workflow.test.js --runInBand

      - name: Report Medrian AI/API CI status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "PASS — Medrian Run AI/API and UC-1 workflow tests"
          else
            echo "FAIL — Medrian Run AI/API and UC-1 workflow tests"
          fi

  alan-ai-ci:
    name: Alan - AI, Scheduling, Workload, and Dummy Canvas Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Alan build ID
        id: alan_build_id
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_ID="omni-ai-build-${{ github.run_number }}-${SHORT_SHA}"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Build ID: $BUILD_ID"

      - name: Run Alan AI prioritization tests
        run: npx jest tests/priorityService.test.js --runInBand

      - name: Run Alan adaptive scheduling and conflict tests
        run: npx jest tests/schedulingService.test.js --runInBand
      
      - name: Run Alan UC-14 workload analysis tests
        run: npx jest tests/workloadService.test.js tests/workloadApi.test.js --runInBand

      - name: Run Alan Dummy Canvas backend API tests
        run: npx jest tests/dummyCanvasApi.test.js --runInBand

      - name: Run Alan Dummy Canvas empty-course tests
        run: npx jest tests/dummyCanvasEmptyCourse.test.js --runInBand

      - name: Report Alan CI status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "PASS — ${{ steps.alan_build_id.outputs.build_id }}"
          else
            echo "FAIL — ${{ steps.alan_build_id.outputs.build_id }}"
          fi


  harleen-canvas-preferences-tests:
    name: Harleen - Canvas and Preferences Tests (SCRUM-329)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Run Canvas API and Preferences contract tests
        working-directory: client
        run: npm run test:harleen

      - name: Install Dummy Canvas dependencies
        working-directory: dummy-canvas
        run: npm install --no-audit --no-fund

      - name: Run standalone Dummy Canvas import tests
        working-directory: dummy-canvas
        run: npm test

  jerry-cc72-security-monitoring:
    name: Jerry - SOC 2 CC7.2 Security Monitoring (SOC2-S4-06)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Generate CC7.2 build ID
        id: cc72_build_id
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_ID="omni-ai-build-${{ github.run_number }}-${SHORT_SHA}"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "CC7.2 build ID: $BUILD_ID"

      - name: Run CC7.2 security monitoring tests
        run: npx jest --runInBand --ci --testPathPattern "tests/(securityLogger|securityLogging|failedAuthDetector)" --json --outputFile=cc72-results.json

      - name: Upload CC7.2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc72-security-monitoring-results-${{ steps.cc72_build_id.outputs.build_id }}
          path: server/cc72-results.json

      - name: Report CC7.2 status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "PASS - CC7.2 - ${{ steps.cc72_build_id.outputs.build_id }}"
          else
            echo "FAIL - CC7.2 - ${{ steps.cc72_build_id.outputs.build_id }}"
          fi

  jerry-sprint5-reliability:
    name: Jerry - Sprint 5 integrity, fault-injection and reliability
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Generate Sprint 5 build ID
        id: s5_build_id
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_ID="omni-ai-build-${{ github.run_number }}-${SHORT_SHA}"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Sprint 5 build ID: $BUILD_ID"

      - name: Run full backend suite with coverage
        env:
          JWT_SECRET: ci-test-secret
        run: npx jest --runInBand --ci --coverage --json --outputFile=s5-results.json

      - name: Run database integrity tests (skipped without secrets)
        env:
          JWT_SECRET: ci-test-secret
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_KEY }}
        run: npx jest --runInBand --ci tests/dbIntegrity.test.js

      - name: Upload Sprint 5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint5-results-${{ steps.s5_build_id.outputs.build_id }}
          path: |
            server/s5-results.json
            server/reliability-results.json
            server/coverage/
          if-no-files-found: warn

      - name: Report Sprint 5 status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "PASS - Sprint 5 - ${{ steps.s5_build_id.outputs.build_id }}"
          else
            echo "FAIL - Sprint 5 - ${{ steps.s5_build_id.outputs.build_id }}"
          fi
