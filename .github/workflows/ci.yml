name: CI
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
jobs:
  backend-tests:
    name: Backend unit/integration tests (Jerry — SCRUM-321 / SCRUM-324)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
 
      - name: Install dependencies (reproducible)
        run: npm ci
 
      - name: Run backend test suite
        run: npm test
 
      - name: Generate build ID
        id: build_id
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_ID="omni-ai-build-${{ github.run_number }}-${SHORT_SHA}"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Build ID: $BUILD_ID"
 
      - name: Report build status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ PASS — ${{ steps.build_id.outputs.build_id }}"
          else
            echo "❌ FAIL — ${{ steps.build_id.outputs.build_id }}"
          fi
 

  harleen-frontend-ci:
    name: Harleen - Frontend Build and Prioritized To-Do Tests

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Harleen build ID
        id: harleen_build_id
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_ID="omni-ai-build-${{ github.run_number }}-${SHORT_SHA}"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Build ID: $BUILD_ID"

      - name: Build React/Vite frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_URL: http://localhost:4000/api
        run: npm run build

      - name: Run Harleen Prioritized To-Do tests
        run: npm run test:prioritized

      - name: Report Harleen CI status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "PASS — ${{ steps.harleen_build_id.outputs.build_id }}"
          else
            echo "FAIL — ${{ steps.harleen_build_id.outputs.build_id }}"
          fi

  medrian-ai-api-tests:
    name: Medrian - AI/API Automated Tests (SCRUM-347)

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run AI/API automated tests
        run: npx jest tests/ai.test.js --runInBand

      - name: Report Medrian AI/API CI status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "PASS — Medrian AI/API tests"
          else
            echo "FAIL — Medrian AI/API tests"
          fi

  alan-ai-ci:
    name: Alan - AI Prioritization and Scheduling Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Alan build ID
        id: alan_build_id
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_ID="omni-ai-build-${{ github.run_number }}-${SHORT_SHA}"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Build ID: $BUILD_ID"

      - name: Run Alan AI prioritization tests
        run: npx jest tests/priorityService.test.js --runInBand

      - name: Report Alan CI status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "PASS — ${{ steps.alan_build_id.outputs.build_id }}"
          else
            echo "FAIL — ${{ steps.alan_build_id.outputs.build_id }}"
          fi
