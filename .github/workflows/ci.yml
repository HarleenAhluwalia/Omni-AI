name: CI
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
jobs:
  backend-tests:
    name: Backend unit/integration tests (Jerry — SCRUM-321 / SCRUM-324)
    runs-on: ubuntu-latest
 
    defaults:
      run:
        working-directory: server
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
 
      - name: Install dependencies (reproducible)
        run: npm ci
 
      - name: Run backend test suite
        run: npm test
 
      - name: Generate build ID
        id: build_id
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_ID="omni-ai-build-${{ github.run_number }}-${SHORT_SHA}"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Build ID: $BUILD_ID"
 
      - name: Report build status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ PASS — ${{ steps.build_id.outputs.build_id }}"
          else
            echo "❌ FAIL — ${{ steps.build_id.outputs.build_id }}"
          fi
 
